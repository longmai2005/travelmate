name: TravelMate CI
on:
  push:
    branches: [main, long_branch, 'codex/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: JavaScript and MongoDB integration
    # MongoDB 8 cannot start on kernels 6.19–7.0.13 (SERVER-121912).
    # Ubuntu 24.04's newer hosted image also hits this startup guard.
    # Use the compatible 22.04 runner until MongoDB supports the newer kernel.
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    services:
      mongodb:
        image: mongo:8.0
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
        env:
          TEST_MONGO_BASE_URI: mongodb://127.0.0.1:27017
