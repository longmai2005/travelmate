services:
  - type: web
    name: travelmate
    runtime: node
    region: singapore
    plan: free
    branch: main
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '22'
      - key: SESSION_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false
