<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Khám phá Việt Nam, lưu điểm đến yêu thích và lên lịch trình mỗi ngày cùng TravelMate."
    />
    <title>Điểm đến yêu thích · TravelMate</title>
    <link rel="icon" href="/images/logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/responsive.css" />
    <link rel="stylesheet" href="/css/upgrades.css" />
    <script defer src="/vendor/lucide.js"></script>
    <script defer src="/js/api.js"></script>
    <script defer src="/js/common.js"></script>
    <script defer src="/js/offline.js"></script>
    <script defer src="/js/session-idle.js"></script>
    <script defer src="/js/auth.js"></script>
    <script defer src="/js/favorites.js"></script>
  </head>
  <body data-page="favorites">
    <a href="#main" class="skip-link">Đến nội dung chính</a>
    <header id="site-header" class="container"></header>
    <main id="main" class="container">
      <div class="page-heading">
        <div>
          <div class="breadcrumb">Trang chủ / Yêu thích</div>
          <div class="eyebrow">NHỮNG NƠI BẠN MUỐN ĐẾN</div>
          <h1>
            Một chút nhớ, một chút mong.
            <span id="favorite-count" class="favorite-counter">0</span>
          </h1>
          <p>Lưu cảm hứng hôm nay, để dành cho hành trình ngày mai.</p>
        </div>
        <a href="/explore" class="btn outline"
          ><i data-lucide="compass"></i> Khám phá thêm</a
        >
      </div>
      <section class="page-body">
        <div class="toolbar">
          <label class="input-wrap"
            ><i data-lucide="search"></i
            ><span class="sr-only">Tìm trong yêu thích</span
            ><input
              id="favorite-search"
              placeholder="Tìm một nơi trong danh sách của bạn..." /></label
          ><span class="field-help">Danh sách của riêng bạn</span>
        </div>
        <div
          id="favorites-grid"
          class="destination-grid"
          aria-live="polite"
        ></div>
      </section>
    </main>
    <footer id="site-footer"></footer>
    <div
      id="toast-stack"
      class="toast-stack"
      role="status"
      aria-live="polite"
    ></div>
  </body>
</html>
