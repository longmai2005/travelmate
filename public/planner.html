<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Khám phá Việt Nam, lưu điểm đến yêu thích và lên lịch trình mỗi ngày cùng TravelMate."
    />
    <title>Lịch trình của tôi · TravelMate</title>
    <link rel="icon" href="/images/logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/responsive.css" />
    <link rel="stylesheet" href="/css/upgrades.css" />
    <link rel="stylesheet" href="/css/trip.css" />
    <script defer src="/vendor/lucide.js"></script>
    <script defer src="/js/api.js"></script>
    <script defer src="/js/budget.js"></script>
    <script defer src="/js/group-budget.js"></script>
    <script defer src="/js/common.js"></script>
    <script defer src="/js/trip-view.js"></script>
    <script defer src="/js/offline.js"></script>
    <script defer src="/js/session-idle.js"></script>
    <script defer src="/js/auth.js"></script>
    <script defer src="/js/planner-extras.js"></script>
    <script defer src="/js/group-ui.js"></script>
    <script defer src="/js/planner.js"></script>
    <script defer src="/js/trip-team.js"></script>
  </head>
  <body data-page="planner">
    <a href="#main" class="skip-link">Đến nội dung chính</a>
    <header id="site-header" class="container"></header>
    <main id="main" class="container">
      <div class="page-heading" id="planner-heading">
        <div>
          <div class="breadcrumb">Trang chủ / Lịch trình</div>
          <div class="eyebrow">MỖI CHUYẾN ĐI, MỘT CÂU CHUYỆN</div>
          <h1>Lịch trình của bạn.</h1>
          <p>Gom những nơi muốn đến thành một hành trình đáng nhớ.</p>
        </div>
        <button id="new-trip" class="btn">
          <i data-lucide="plus"></i> Tạo chuyến đi mới
        </button>
      </div>
      <section class="page-body">
        <div id="trip-dashboard" class="trip-grid" aria-live="polite"></div>
        <div id="trip-editor" hidden></div>
      </section>
      <dialog id="trip-dialog" aria-labelledby="trip-dialog-title">
        <div class="modal-body">
          <div class="modal-heading">
            <div>
              <div class="eyebrow">ĐIỀU HAY ĐANG Ở PHÍA TRƯỚC</div>
              <h2 id="trip-dialog-title">Tạo chuyến đi mới</h2>
              <p>Tối đa 7 ngày, đủ cho một chuyến đi thật trọn vẹn.</p>
            </div>
            <button class="icon-btn modal-close" data-close aria-label="Đóng">
              <i data-lucide="x"></i>
            </button>
          </div>
          <form id="trip-form">
            <div class="form-grid">
              <label class="form-field full"
                >Tên chuyến đi<input
                  name="title"
                  required
                  maxlength="150"
                  placeholder="Ví dụ: Ba ngày rong chơi Đà Nẵng" /></label
              ><label class="form-field"
                >Ngày khởi hành<input
                  name="startDate"
                  type="date"
                  required /></label
              ><label class="form-field"
                >Ngày kết thúc<input
                  name="endDate"
                  type="date"
                  required /></label
              ><label class="form-field"
                >Số người đồng hành<input
                  name="travelers"
                  type="number"
                  min="1"
                  max="100"
                  value="2"
                  required /></label
              ><label class="form-field"
                >Ngân sách cả chuyến đi (VND)<input
                  name="budgetLimitVnd"
                  type="number"
                  min="0"
                  step="1"
                  value="3000000"
                  required /></label
              ><label class="form-field full"
                >Ghi chú chuyến đi<textarea
                  name="notes"
                  maxlength="2000"
                  placeholder="Những điều bạn muốn trải nghiệm..."
                ></textarea>
              </label>
            </div>
            <div class="form-error" id="trip-form-error" role="alert"></div>
            <div class="form-actions">
              <button class="btn outline" type="button" data-close>
                Để sau</button
              ><button class="btn" type="submit">
                Bắt đầu lên lịch <i data-lucide="arrow-right"></i>
              </button>
            </div>
          </form>
        </div>
      </dialog>
    </main>
    <footer id="site-footer"></footer>
    <div
      id="toast-stack"
      class="toast-stack"
      role="status"
      aria-live="polite"
    ></div>
  </body>
</html>
